[project]
name = "gpustarve"
version = "0.1.0"
description = "Cold-start latency and energy measurement for edge LLM inference"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
